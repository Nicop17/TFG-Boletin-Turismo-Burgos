name: Run Burgos Scraper

on:
  workflow_dispatch: # Permite lanzarlo a mano
  # schedule:
    # - cron: '0 3 * * *' # Se ejecuta todos los días a las 03:00 (hora UTC). 
    # Si alguna vez falla o se corta antes de terminar, volverá a ejecutarse automáticamente al día siguiente, 
    # lo que es útil para asegurar que el scraper se ejecute regularmente sin intervención manual.
    # No supone un gasto extra ya que si ha funcionado, todos los elementos estarán ya procesados y se cerrará.

  schedule:
    # 0 (minuto) 19 (hora UTC = 21:00 España) 13 (día) 5 (mes) * (cualquier día de la semana)
    - cron: '0 19 13 5 *' # Prueba ejecución automática hoy a las 21:00 (hora local, UTC+2).
jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Google Cloud Key
      run: |
        echo "${{ secrets.GCP_SA_KEY }}"  > key.json

    - name: Run Scraper
      env:
        APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        GOOGLE_APPLICATION_CREDENTIALS: ./key.json
      run: python src/main_scraper_pipeline.py